<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Talking Tom 2 - Billi Wala Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <!-- TOP STATUS BAR -->
    <header class="top-bar">
      <div class="stat-pill" title="Khushi (Fun)">
        <span class="stat-icon">😄</span>
        <div class="stat-bar-container">
          <div class="stat-bar" id="bar-fun" style="width: 85%;"></div>
        </div>
      </div>
      <div class="stat-pill" title="Bhookh (Hunger)">
        <span class="stat-icon">🍔</span>
        <div class="stat-bar-container">
          <div class="stat-bar" id="bar-hunger" style="width: 70%;"></div>
        </div>
      </div>
      <div class="stat-pill" title="Safai (Hygiene)">
        <span class="stat-icon">🛁</span>
        <div class="stat-bar-container">
          <div class="stat-bar" id="bar-hygiene" style="width: 80%;"></div>
        </div>
      </div>
      <div class="stat-pill" title="Neend (Energy)">
        <span class="stat-icon">⚡</span>
        <div class="stat-bar-container">
          <div class="stat-bar" id="bar-energy" style="width: 90%;"></div>
        </div>
      </div>
      <div class="coin-pill">
        <span class="coin-icon">🪙</span>
        <span id="coin-count">150</span>
      </div>
    </header>

    <!-- MAIN SCENE CONTAINER -->
    <main id="scene-viewport" class="room-living">
      <!-- Dark overlay for Bedroom / Lights off -->
      <div id="night-overlay" class="night-overlay hidden">
        <div class="moon">🌙</div>
        <div class="star s1">⭐</div>
        <div class="star s2">✨</div>
        <div class="star s3">⭐</div>
      </div>

      <!-- Floating interaction FX layer -->
      <div id="fx-layer"></div>

      <!-- SPEECH BUBBLE -->
      <div id="speech-bubble" class="speech-bubble hidden">
        <span id="speech-text">Meow! Kaise ho dost?</span>
      </div>

      <!-- TOM CHARACTER STAGE -->
      <div id="tom-stage">
        <!-- SVG Interactive Tom -->
        <svg id="tom-svg" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="tomFur" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#9ea7ad"/>
              <stop offset="70%" stop-color="#737c82"/>
              <stop offset="100%" stop-color="#555c61"/>
            </radialGradient>
            <radialGradient id="tomBelly" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#fdf9f3"/>
              <stop offset="85%" stop-color="#e3ded5"/>
              <stop offset="100%" stop-color="#cfc9be"/>
            </radialGradient>
            <linearGradient id="innerEar" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff99bb"/>
              <stop offset="100%" stop-color="#e66890"/>
            </linearGradient>
            <radialGradient id="eyeGreen" cx="35%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#76ff03"/>
              <stop offset="60%" stop-color="#43a047"/>
              <stop offset="100%" stop-color="#1b5e20"/>
            </radialGradient>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- Floor Shadow -->
          <ellipse cx="200" cy="495" rx="120" ry="20" fill="rgba(0,0,0,0.22)"/>

          <!-- Tail -->
          <g id="tom-tail" class="animated-tail">
            <path d="M 120 420 Q 50 430 40 370 Q 30 310 65 290 Q 75 305 55 350 Q 70 395 135 410 Z" fill="url(#tomFur)"/>
            <path d="M 40 370 Q 30 310 65 290 Q 75 305 55 350 Z" fill="#ffffff" opacity="0.6"/>
          </g>

          <!-- Feet & Paws -->
          <g id="tom-feet">
            <g id="foot-left" class="clickable-body-part" data-part="foot">
              <ellipse cx="140" cy="475" rx="35" ry="22" fill="url(#tomFur)" filter="url(#shadow)"/>
              <ellipse cx="140" cy="472" rx="20" ry="12" fill="#fff" opacity="0.8"/>
              <ellipse cx="140" cy="473" rx="10" ry="7" fill="#ff80ab"/>
              <circle cx="127" cy="466" r="3.5" fill="#ff80ab"/>
              <circle cx="140" cy="462" r="3.5" fill="#ff80ab"/>
              <circle cx="153" cy="466" r="3.5" fill="#ff80ab"/>
            </g>
            <g id="foot-right" class="clickable-body-part" data-part="foot">
              <ellipse cx="260" cy="475" rx="35" ry="22" fill="url(#tomFur)" filter="url(#shadow)"/>
              <ellipse cx="260" cy="472" rx="20" ry="12" fill="#fff" opacity="0.8"/>
              <ellipse cx="260" cy="473" rx="10" ry="7" fill="#ff80ab"/>
              <circle cx="247" cy="466" r="3.5" fill="#ff80ab"/>
              <circle cx="260" cy="462" r="3.5" fill="#ff80ab"/>
              <circle cx="273" cy="466" r="3.5" fill="#ff80ab"/>
            </g>
          </g>

          <!-- Body / Torso -->
          <g id="tom-torso" class="clickable-body-part" data-part="belly">
            <ellipse cx="200" cy="355" rx="90" ry="110" fill="url(#tomFur)" filter="url(#shadow)"/>
            <ellipse id="tom-belly-patch" cx="200" cy="365" rx="65" ry="85" fill="url(#tomBelly)"/>
            <circle cx="200" cy="405" r="3" fill="#b0a89d" opacity="0.7"/>
          </g>

          <!-- Dirt Smudges (Hygiene low) -->
          <g id="dirt-spots" class="hidden">
            <ellipse cx="170" cy="340" rx="14" ry="9" fill="#5c4033" opacity="0.65" transform="rotate(-15 170 340)"/>
            <ellipse cx="230" cy="380" rx="18" ry="11" fill="#5c4033" opacity="0.6" transform="rotate(20 230 380)"/>
            <circle cx="195" cy="315" r="8" fill="#5c4033" opacity="0.55"/>
            <circle cx="140" cy="200" r="7" fill="#5c4033" opacity="0.5"/>
          </g>

          <!-- Soap Bubbles Overlay -->
          <g id="soap-layer"></g>

          <!-- Clothes: Bowtie -->
          <g id="acc-bowtie" class="acc-item hidden">
            <polygon points="175,260 175,280 195,270" fill="#e91e63"/>
            <polygon points="225,260 225,280 205,270" fill="#e91e63"/>
            <circle cx="200" cy="270" r="7" fill="#c2185b"/>
          </g>

          <!-- Arms & Hands -->
          <g id="arm-left" class="clickable-body-part" data-part="arm">
            <path d="M 125 300 C 90 330 80 385 105 405 C 120 415 135 385 130 350 Z" fill="url(#tomFur)"/>
            <circle cx="106" cy="398" r="16" fill="url(#tomBelly)"/>
          </g>
          <g id="arm-right" class="clickable-body-part" data-part="arm">
            <path d="M 275 300 C 310 330 320 385 295 405 C 280 415 265 385 270 350 Z" fill="url(#tomFur)"/>
            <circle cx="294" cy="398" r="16" fill="url(#tomBelly)"/>
          </g>

          <!-- Head Group -->
          <g id="tom-head-group">
            <!-- Ears -->
            <g id="ear-left" class="clickable-body-part" data-part="ear">
              <polygon points="100,165 70,50 155,105" fill="url(#tomFur)" filter="url(#shadow)"/>
              <polygon points="98,150 82,75 142,112" fill="url(#innerEar)"/>
              <path d="M 100 145 Q 115 135 125 150" stroke="#fff" stroke-width="4" fill="none" opacity="0.8"/>
            </g>
            <g id="ear-right" class="clickable-body-part" data-part="ear">
              <polygon points="300,165 330,50 245,105" fill="url(#tomFur)" filter="url(#shadow)"/>
              <polygon points="302,150 318,75 258,112" fill="url(#innerEar)"/>
              <path d="M 300 145 Q 285 135 275 150" stroke="#fff" stroke-width="4" fill="none" opacity="0.8"/>
            </g>

            <!-- Head Base -->
            <ellipse id="tom-head-base" cx="200" cy="180" rx="105" ry="92" fill="url(#tomFur)" filter="url(#shadow)" class="clickable-body-part" data-part="head"/>

            <!-- Muzzle / Chubby Cheeks -->
            <path d="M 130 205 C 130 245 170 255 200 240 C 230 255 270 245 270 205 C 270 175 240 170 200 178 C 160 170 130 175 130 205 Z" fill="url(#tomBelly)"/>

            <!-- Whiskers -->
            <g id="whiskers" stroke="#444" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
              <line x1="140" y1="210" x2="80" y2="195"/>
              <line x1="140" y1="218" x2="70" y2="218"/>
              <line x1="140" y1="226" x2="85" y2="238"/>
              <line x1="260" y1="210" x2="320" y2="195"/>
              <line x1="260" y1="218" x2="330" y2="218"/>
              <line x1="260" y1="226" x2="315" y2="238"/>
            </g>

            <!-- Nose -->
            <path id="tom-nose" d="M 190 195 Q 200 190 210 195 Q 200 210 190 195 Z" fill="#ff6b8b" class="clickable-body-part" data-part="nose"/>

            <!-- Eyes -->
            <g id="tom-eyes" class="clickable-body-part" data-part="eyes">
              <!-- Left Eye -->
              <g id="eye-left-group">
                <ellipse cx="155" cy="150" rx="26" ry="32" fill="#ffffff" stroke="#4a5257" stroke-width="3"/>
                <ellipse id="iris-left" cx="158" cy="150" rx="18" ry="24" fill="url(#eyeGreen)"/>
                <ellipse id="pupil-left" cx="159" cy="150" rx="8" ry="17" fill="#111111"/>
                <circle cx="153" cy="142" r="6" fill="#ffffff"/>
                <circle cx="163" cy="158" r="2.5" fill="#ffffff"/>
                <path id="eyelid-left" d="M 129 150 Q 155 150 181 150" stroke="#737c82" stroke-width="0" fill="#737c82"/>
              </g>

              <!-- Right Eye -->
              <g id="eye-right-group">
                <ellipse cx="245" cy="150" rx="26" ry="32" fill="#ffffff" stroke="#4a5257" stroke-width="3"/>
                <ellipse id="iris-right" cx="242" cy="150" rx="18" ry="24" fill="url(#eyeGreen)"/>
                <ellipse id="pupil-right" cx="241" cy="150" rx="8" ry="17" fill="#111111"/>
                <circle cx="237" cy="142" r="6" fill="#ffffff"/>
                <circle cx="247" cy="158" r="2.5" fill="#ffffff"/>
                <path id="eyelid-right" d="M 219 150 Q 245 150 271 150" stroke="#737c82" stroke-width="0" fill="#737c82"/>
              </g>
            </g>

            <!-- Eyebrows -->
            <g id="eyebrows" stroke="#4a5257" stroke-width="4.5" stroke-linecap="round" fill="none">
              <path id="eyebrow-left" d="M 135 116 Q 155 110 175 118"/>
              <path id="eyebrow-right" d="M 225 118 Q 245 110 265 116"/>
            </g>

            <!-- Mouth & Tongue -->
            <g id="tom-mouth-group">
              <path id="mouth-line" d="M 180 220 Q 200 232 220 220" stroke="#333" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <path id="mouth-open" d="M 180 220 Q 200 265 220 220 Z" fill="#660011" class="hidden"/>
              <path id="mouth-tongue" d="M 188 238 Q 200 244 212 238 Q 200 260 188 238 Z" fill="#ff4081" class="hidden"/>
              <polygon id="tooth-left" points="188,220 193,227 197,220" fill="#fff" class="hidden"/>
              <polygon id="tooth-right" points="203,220 207,227 212,220" fill="#fff" class="hidden"/>
            </g>

            <!-- Dizzy Stars -->
            <g id="dizzy-stars" class="hidden">
              <text x="120" y="80" font-size="28" class="spin-star">💫</text>
              <text x="200" y="50" font-size="28" class="spin-star delay-1">⭐</text>
              <text x="260" y="80" font-size="28" class="spin-star delay-2">💫</text>
            </g>

            <!-- Accessories: Sunglasses -->
            <g id="acc-sunglasses" class="acc-item hidden">
              <path d="M 175 146 Q 200 142 225 146" stroke="#111" stroke-width="5" fill="none"/>
              <rect x="130" y="130" width="48" height="38" rx="10" fill="#111111" stroke="#333" stroke-width="3"/>
              <line x1="135" y1="135" x2="160" y2="160" stroke="#fff" stroke-width="3" opacity="0.4"/>
              <rect x="222" y="130" width="48" height="38" rx="10" fill="#111111" stroke="#333" stroke-width="3"/>
              <line x1="227" y1="135" x2="252" y2="160" stroke="#fff" stroke-width="3" opacity="0.4"/>
            </g>

            <!-- Accessories: Party Hat -->
            <g id="acc-hat" class="acc-item hidden">
              <polygon points="150,90 200,-10 250,90" fill="#9c27b0" stroke="#ffeb3b" stroke-width="4"/>
              <ellipse cx="200" cy="90" rx="55" ry="12" fill="#7b1fa2"/>
              <circle cx="200" cy="-10" r="10" fill="#ffeb3b"/>
              <text x="188" y="55" font-size="16" fill="#fff">⭐</text>
            </g>

            <!-- Accessories: Nightcap -->
            <g id="acc-nightcap" class="acc-item hidden">
              <path d="M 140 100 Q 200 40 270 95 Q 310 130 330 200 Q 315 200 290 140 Q 220 70 140 100 Z" fill="#2196f3"/>
              <circle cx="330" cy="200" r="14" fill="#ffffff"/>
              <ellipse cx="200" cy="98" rx="65" ry="12" fill="#e3f2fd"/>
            </g>
          </g>
        </svg>

        <!-- Animated Floating Zzz -->
        <div id="sleep-zzz" class="sleep-zzz hidden">
          <span class="z-item z1">Z</span>
          <span class="z-item z2">z</span>
          <span class="z-item z3">z</span>
        </div>
      </div>

      <!-- KITCHEN DRAWER: Food items -->
      <div id="kitchen-drawer" class="drawer-panel hidden">
        <div class="drawer-header">Tom Ko Khana Khilao 🍽️</div>
        <div class="food-shelf">
          <button class="food-btn" data-food="milk" title="Doodh (Milk)">
            <span class="food-emoji">🥛</span>
            <span class="food-name">Doodh</span>
          </button>
          <button class="food-btn" data-food="fish" title="Tazi Machhli (Fish)">
            <span class="food-emoji">🐟</span>
            <span class="food-name">Machhli</span>
          </button>
          <button class="food-btn" data-food="cake" title="Mitha Cake (Cake)">
            <span class="food-emoji">🧁</span>
            <span class="food-name">Cake</span>
          </button>
          <button class="food-btn" data-food="chili" title="Teekhi Mirchi! (Spicy Chili)">
            <span class="food-emoji">🌶️</span>
            <span class="food-name">Mirchi!</span>
          </button>
          <button class="food-btn" data-food="watermelon" title="Tarbooz (Watermelon)">
            <span class="food-emoji">🍉</span>
            <span class="food-name">Tarbooz</span>
          </button>
        </div>
      </div>

      <!-- BATHROOM TOOLS -->
      <div id="bath-drawer" class="drawer-panel hidden">
        <div class="drawer-header">Tom Ko Nahlao 🛁</div>
        <div class="bath-shelf">
          <button id="btn-soap" class="tool-btn" title="Sabun Lagao">
            <span class="tool-emoji">🧼</span>
            <span class="tool-name">Sabun</span>
          </button>
          <button id="btn-shower" class="tool-btn" title="Pani Se Nahlao">
            <span class="tool-emoji">🚿</span>
            <span class="tool-name">Shower</span>
          </button>
          <button id="btn-potty" class="tool-btn" title="Toilet / Potty">
            <span class="tool-emoji">🚽</span>
            <span class="tool-name">Toilet</span>
          </button>
        </div>
      </div>

      <!-- BEDROOM CONTROLS: Lamp Switch -->
      <div id="bedroom-controls" class="bedroom-panel hidden">
        <button id="btn-lamp" class="lamp-btn" title="Batti Gul / Jalayein">
          <span class="lamp-emoji">💡</span>
          <span id="lamp-label">Batti Band Karo</span>
        </button>
      </div>

      <!-- WARDROBE DRAWER -->
      <div id="wardrobe-drawer" class="drawer-panel hidden">
        <div class="drawer-header">Tom Ke Kapde Aur Chashma 🕶️</div>
        <div class="wardrobe-shelf">
          <button class="wardrobe-btn" data-acc="hat">
            <span class="tool-emoji">🎩</span>
            <span class="tool-name">Party Topi</span>
          </button>
          <button class="wardrobe-btn" data-acc="sunglasses">
            <span class="tool-emoji">🕶️</span>
            <span class="tool-name">Kala Chashma</span>
          </button>
          <button class="wardrobe-btn" data-acc="bowtie">
            <span class="tool-emoji">🎀</span>
            <span class="tool-name">Tie</span>
          </button>
        </div>
      </div>

      <!-- TALKING TOM MIC STATUS BAR -->
      <div id="mic-status-box" class="mic-status-box hidden">
        <div class="mic-pulsing-wave">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span id="mic-label">Tom Sun Raha Hai... Bolo! 🎤</span>
      </div>

      <!-- QUICK TALK / TEXT INPUT DRAWER -->
      <div id="talk-input-drawer" class="drawer-panel hidden">
        <div class="drawer-header">Tom Se Baat Karo 💬</div>
        <div class="talk-input-row">
          <input type="text" id="talk-text-input" placeholder="Kuch bolo... (jaise: Tom tum kaise ho?)">
          <button id="btn-send-talk">Bolo 🗣️</button>
        </div>
        <div class="quick-phrases">
          <button class="phrase-chip" data-phrase="Meow! Main ek pyari billi hoon!">🐱 Pyari Billi</button>
          <button class="phrase-chip" data-phrase="Namaste dost! Mujhse dosti karoge?">👋 Namaste!</button>
          <button class="phrase-chip" data-phrase="Haha! Gudgudi mat karo!">😂 Gudgudi</button>
          <button class="phrase-chip" data-phrase="Mujhe tazi machhli aur doodh do!">🐟 Bhookh lagi</button>
        </div>
      </div>

      <!-- MINI-GAME MODAL -->
      <div id="mini-game-modal" class="modal-overlay hidden">
        <div class="mini-game-container">
          <div class="mini-game-header">
            <span>🎮 Machhli Pakdo Game</span>
            <span id="game-score-display">Score: 0 | 🪙 0</span>
            <button id="btn-close-game" class="close-game-btn">✕</button>
          </div>
          <canvas id="mini-game-canvas" width="340" height="420"></canvas>
          <div class="mini-game-controls">
            <button id="btn-move-left" class="game-ctrl-btn">◀ Left</button>
            <span class="game-hint">Screen par drag ya touch karo!</span>
            <button id="btn-move-right" class="game-ctrl-btn">Right ▶</button>
          </div>
        </div>
      </div>
    </main>

    <!-- BOTTOM ROOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-room="living" title="Living Room">
        <span class="nav-icon">🛋️</span>
        <span class="nav-label">Ghar</span>
      </button>
      <button class="nav-tab" data-room="kitchen" title="Rasoi (Kitchen)">
        <span class="nav-icon">🍽️</span>
        <span class="nav-label">Khana</span>
      </button>
      <button class="nav-tab" data-room="bath" title="Bathroom">
        <span class="nav-icon">🛁</span>
        <span class="nav-label">Nahana</span>
      </button>
      <button class="nav-tab" data-room="bedroom" title="Bedroom">
        <span class="nav-icon">🛏️</span>
        <span class="nav-label">Sona</span>
      </button>
      <button class="nav-tab" data-room="game" title="Mini Games">
        <span class="nav-icon">🎮</span>
        <span class="nav-label">Game</span>
      </button>
      <button id="btn-mic-toggle" class="nav-tab mic-tab" title="Awaz Mimic / Talking Tom">
        <span class="nav-icon">🎙️</span>
        <span class="nav-label">Bolo</span>
      </button>
      <button id="btn-wardrobe-toggle" class="nav-tab" title="Kapde Badlo">
        <span class="nav-icon">🎩</span>
        <span class="nav-label">Fashion</span>
      </button>
    </nav>
  </div>

  <script src="game.js"></script>
</body>
</html>
