name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME). The setup-android action
      # failed on it ("Failed to find package 'tools'"), so use the preinstalled sdkmanager.
      - name: Install Android SDK packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # No Gradle wrapper is committed, so install the Gradle version this
      # project was written for (AGP 8.5.2 needs Gradle 8.7+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Verify APK exists
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            ls -l app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Searching for APKs..."
            find app/build/outputs/apk -name "*.apk" -ls
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: omni-assistant-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
        continue-on-error: true
